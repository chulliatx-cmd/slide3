  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

sition:absolute;left:100px;top:56px;font:800 44px/1.15 'Public Sans',sans-serif;color:#1c1e15;\">Sécuriser les paiements en magasin et réduire les coûts liés au chèque<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:160px;bottom:80px;display:grid;grid-template-columns:1fr 1fr;gap:22px;\">\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:26px 30px;\">\n      <div style=\"font:700 19px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#b8503a;margin-bottom:12px;\">🔎 Constat — 2025<\u002Fdiv>\n      <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#1c1e15;\">Le chèque représente 0,69 % des paiements en magasin et 4,23 % du CA. Il expose à un double risque :<br><b>Financier<\u002Fb> — 2,3 M€ prestation scoring/garantie SSP (budget 2026) ; 333 k€ d'impayés non indemnisés (clauses contractuelles).<br><b>Opérationnel<\u002Fb> — dépendance à SSP (situation financière fragile) ; aucune solution sécurisée pour les paniers élevés en cas de défaillance SSP.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:26px 30px;\">\n      <div style=\"font:700 19px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6a9c1f;margin-bottom:12px;\">💡 Solution<\u002Fdiv>\n      <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#1c1e15;\">Mettre en place le virement immédiat (Fintecture) en ligne de caisse.<br><b>Réduction des coûts<\u002Fb> — à 54 % d'adoption : coût SSP/Fintecture 2,3 M€ → 1,26 M€ (-1,04 M€ ; -45 %) ; impayés non indemnisés -66 k€ (-54 %).<br><b>Défaillance SSP<\u002Fb> — solution alternative immédiate, sécurisation des ventes à panier élevé.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:26px 30px;\">\n      <div style=\"font:700 19px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6a9c1f;margin-bottom:12px;\">🚀 Mise en œuvre — Q3 2026<\u002Fdiv>\n      <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#1c1e15;\">Réutilisation des flux WEB / COBO existants (complexité faible).<br>Effort budgétaire — création du moyen de paiement (IT/TCS) : 25 jours ; rapprochement &amp; comptabilité : 2 jours*.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#158158;border-radius:6px;padding:26px 30px;\">\n      <div style=\"font:700 19px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#93cc3e;margin-bottom:12px;\">🎯 Conclusion<\u002Fdiv>\n      <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#f5f4ec;\">Le virement immédiat permet de réduire nos coûts, de supprimer progressivement le risque chèque et de sécuriser nos ventes élevées indépendamment de SSP, en s'appuyant sur une architecture existante et maîtrisée.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;bottom:36px;font:400 16px 'Public Sans',sans-serif;color:#9a9d8d;\">* Projection avec les abaques, à affiner par ADEO.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cover Fintecture\" data-speaker-notes=\"Point d'étape Omnistore/Fintecture\" style=\"background:#158158;position:relative;overflow:hidden;font-family:'Public Sans',sans-serif;\">\n  <div style=\"position:absolute;left:0;top:0;bottom:0;width:14px;background:#6a9c1f;\"><\u002Fdiv>\n  <div style=\"position:absolute;left:140px;top:420px;font:600 22px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#93cc3e;\">06.05.2026<\u002Fdiv>\n  <div style=\"position:absolute;left:140px;top:470px;right:140px;font:800 108px/1.05 'Public Sans',sans-serif;color:#f5f4ec;\">Virement immédiat<\u002Fdiv>\n  <div style=\"position:absolute;left:140px;top:640px;font:400 30px/1.4 'Public Sans',sans-serif;color:#a9ac9a;\">Omnistore / Fintecture<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Réponses aux questions\" data 02Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:100px;top:230px;width:400px;background:#158158;border-radius:6px;padding:32px;\">\n    <div style=\"font:700 20px 'Public Sans',sans-serif;color:#93cc3e;\">Oui, 100 % autonome<\u002Fdiv>\n    <div style=\"margin-top:12px;font:400 19px/1.5 'Public Sans',sans-serif;color:#c9cbbc;\">HSC intervient uniquement sur demande client ou en cas d'incident.<\u002Fdiv>\n    <div style=\"margin-top:24px;padding-top:20px;border-top:1px solid #2a2d22;font:400 19px/1.5 'Public Sans',sans-serif;color:#c9cbbc;\">Statut paiement remonté à la caisse en ≤ 10 s — dans les faits, env. 2 secondes.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;bottom:80px;background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:26px 34px;font:600 24px/1.4 'Public Sans',sans-serif;color:#1c1e15;\">370 000 transactions / an, soit 7,4 transactions / jour / magasin — 0,37 % du total des transactions.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"CCO alternative QR\" data-speaker-notes=\"Alternative au scan du QR code pour le client en CCO\" style=\"background:#faf9f4;position:relative;font-family:'Public Sans',sans-serif;\">\n  <div style=\"position:absolute;left:100px;top:64px;font:600 20px/1 'Public Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6a9c1f;\">Réponses aux questions<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;top:120px;right:100px;font:800 46px/1.2 'Public Sans',sans-serif;color:#1c1e15;\">CCO — alternative au scan du QR code pour le client<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;top:220px;right:100px;font:400 22px/1.5 'Public Sans',sans-serif;color:#6d7060;\">95 % des lignes de caisse sont équipées d'écrans sur mâts, orientables vers le client. Les SRM, SAV et Location peuvent être en configuration meuble, non orientable.<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:340px;bottom:90px;display:grid;grid-template-columns:1fr 1fr;gap:32px;\">\n    <div style=\"background:#158158;border-radius:6px;padding:36px;border:2px solid #93cc3e;\">\n      <div style=\"font:700 22px 'Public Sans',sans-serif;color:#93cc3e;\">✓ Option 1 — retenue<\u002Fdiv>\n      <div style=\"margin-top:14px;font:600 26px 'Public Sans',sans-serif;color:#f5f4ec;\">Envoi du lien (SMS / email)<\u002Fdiv>\n      <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:12px;font:400 20px/1.4 'Public Sans',sans-serif;color:#c9cbbc;\">\n        <div>+ Pas de développement supplémentaire<\u002Fdiv>\n        <div>+ Parcours unique entre SCO et CCO<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:36px;\">\n      <div style=\"font:700 22px 'Public Sans',sans-serif;color:#b8503a;\">✗ Option 2 — écartée<\u002Fdiv>\n      <div style=\"margin-top:14px;font:600 26px 'Public Sans',sans-serif;color:#1c1e15;\">Impression QR sur ticket<\u002Fdiv>\n      <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:12px;font:400 20px/1.4 'Public Sans',sans-serif;color:#6d7060;\">\n        <div>− Ne répond pas à la difficulté de scanner le QR code<\u002Fdiv>\n        <div>− Développement et adaptation du flux d'impression<\u002Fdiv>\n        <div>− Parcours différent SCO / CCO à maintenir, étape et papier supplémentaires<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Technomat\" data-speaker-notes=\"Cas particulier Technomat\" style=\"background:#faf9f4;position:relative;font-family:'Public Sans',sans-serif;\">\n  <div style=\"position:absolute;left:100px;top:64px;font:600 20px/1 'Public Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6a9c1f;\">Réponses aux questions<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;top:120px;right:100px;font:800 48px/1.2 'Public Sans',sans-serif;color:#1c1e15;\">Technomat<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;top:210px;right:100px;font:400 22px/1.5 'Public Sans',sans-serif;color:#6d7060;\">La solution en ligne de caisse n'existe pas. Uniquement intégrée dans le parcours de paiement des commandes.<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:320px;bottom:90px;display:grid;grid-template-columns:1fr 1fr;gap:32px;\">\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:36px;\">\n      <div style=\"font:700 20px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6a9c1f;\">Sur la commande — intégré<\u002Fdiv>\n      <div style=\"margin-top:16px;font:400 21px/1.6 'Public Sans',sans-serif;color:#1c1e15;\">Solution totalement intégrée au système de commande :<br>→ Envoi par mail si client à distance<br>→ QR code si client en rayon<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:36px;\">\n      <div style=\"font:700 20px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#c99a3a;\">⚠ En caisse — déblocage manuel<\u002Fdiv>\n      <div style=\"margin-top:16px;font:400 20px/1.4 'Public Sans',sans-serif;color:#6d7060;\">Cas d'urgence uniquement — plafond CB atteint, chèque refusé SSP, plantage système CB…<\u002Fdiv>\n      <div style=\"margin-top:18px;font:400 21px/1.6 'Public Sans',sans-serif;color:#1c1e15;\">1 → Création du lien via la console Fintecture, en manuel<br>2 → Saisie du virement sur la caisse via le mode de paiement « virement »<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Visibilité HSC\" data-speaker-notes=\"Visibilité HSC sur l'avancement du paiement client\" style=\"background:#faf9f4;position:relative;font-family:'Public Sans',sans-serif;\">\n  <div style=\"position:absolute;left:100px;top:64px;font:600 20px/1 'Public Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6a9c1f;\">Réponses aux questions<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;top:120px;right:100px;font:800 46px/1.2 'Public Sans',sans-serif;color:#1c1e15;\">Visibilité HSC sur l'avancement du paiement client<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;top:210px;right:100px;font:400 22px/1.5 'Public Sans',sans-serif;color:#6d7060;\">Fintecture émet 4 événements → Cookie en propage 2 → la caisse reçoit 2 statuts.<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:310px;bottom:220px;display:flex;align-items:center;gap:0;\">\n    <div style=\"flex:1.3;background:#158158;border-radius:6px;padding:26px;\">\n      <div style=\"font:700 18px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#93cc3e;margin-bottom:14px;\">Fintecture — 4 événements émis<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font:400 19px/1.3 'Public Sans',sans-serif;color:#c9cbbc;\">\n        <div>1 — QR affiché / lien envoyé, en attente client<\u002Fdiv>\n        <div>2 — Banque sélectionnée · authentification<\u002Fdiv>\n        <div>3 — Paiement confirmé<\u002Fdiv>\n        <div>4 — Paiement échoué / expiré / annulé<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:none;width:80px;text-align:center;font:800 32px 'Public Sans',sans-serif;color:#c7c4b4;\">→<\u002Fdiv>\n    <div style=\"flex:0.7;background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:26px;text-align:center;\">\n      <div style=\"font:700 18px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6d7060;\">Cookie<\u002Fdiv>\n      <div style=\"margin-top:14px;font:400 19px 'Public Sans',sans-serif;color:#1c1e15;\">Propage 2 des 4 événements à la caisse<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:none;width:80px;text-align:center;font:800 32px 'Public Sans',sans-serif;color:#c7c4b4;\">→<\u002Fdiv>\n    <div style=\"flex:1;background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:26px;\">\n      <div style=\"font:700 18px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6d7060;margin-bottom:14px;\">Caisse — 2 statuts reçus<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\"><div style=\"width:14px;height:14px;border-radius:50%;background:#6a9c1f;\"><\u002Fdiv><div style=\"font:600 19px 'Public Sans',sans-serif;color:#1c1e15;\">PAYÉ — paiement confirmé<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;\"><div style=\"width:14px;height:14px;border-radius:50%;background:#b8503a;\"><\u002Fdiv><div style=\"font:600 19px 'Public Sans',sans-serif;color:#1c1e15;\">ÉCHEC — échec / expiré / annulé<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;bottom:80px;background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:26px 34px;font:400 21px/1.5 'Public Sans',sans-serif;color:#1c1e15;\">Dans un temps 2 : afficher les statuts « lien envoyé » et « banque sélectionnée » sur l'écran de caisse — chantier technique Omnistore × Fintecture à prévoir (hors périmètre paiement Cookie aujourd'hui). En cas d'échec, retour au choix du mode de paiement.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Risque cannibalisation CB\" data-speaker-notes=\"Risque de cannibalisation de la CB / impact productivité\" style=\"background:#faf9f4;position:relative;font-family:'Public Sans',sans-serif;\">\n  <div style=\"position:absolute;left:100px;top:64px;font:600 20px/1 'Public Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6a9c1f;\">Réponses aux questions<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;top:120px;right:100px;font:800 44px/1.2 'Public Sans',sans-serif;color:#1c1e15;\">Risque de cannibalisation de la CB / impact productivité<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:220px;background:#158158;border-radius:6px;padding:26px 34px;\">\n    <div style=\"font:700 18px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#93cc3e;margin-bottom:10px;\">Principe retenu<\u002Fdiv>\n    <div style=\"font:500 22px/1.5 'Public Sans',sans-serif;color:#f5f4ec;\">Pas de seuil minimum sur le panier. La proposition du virement immédiat est laissée à l'intelligence situationnelle de l'HSC — ne pas conditionner l'éligibilité au montant du panier.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:400px;bottom:90px;display:grid;grid-template-columns:1fr 1fr;gap:32px;\">\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:34px;\">\n      <div style=\"font:700 20px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6d7060;margin-bottom:16px;\">Cas 1 — Client veut payer en chèque<\u002Fdiv>\n      <div style=\"font:italic 400 22px/1.5 'Public Sans',sans-serif;color:#1c1e15;font-style:italic;\">« Si vous avez votre application bancaire sur votre smartphone, vous pouvez payer par virement instantané. »<\u002Fdiv>\n      <div style=\"margin-top:16px;font:400 18px 'Public Sans',sans-serif;color:#9a9d8d;\">Réflexe HSC<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:34px;\">\n      <div style=\"font:700 20px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6d7060;margin-bottom:16px;\">Cas 2 — Refus du moyen initial<\u002Fdiv>\n      <div style=\"font:400 22px/1.5 'Public Sans',sans-serif;color:#1c1e15;\">CB refusée, chèque refusé par SSP… l'HSC peut proposer le virement immédiat → satisfaction client.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Couverture bancaire\" data-speaker-notes=\"Couverture bancaire - taux d'acceptation\" style=\"background:#faf9f4;position:relative;font-family:'Pub right:100px;font:800 40px/1.2 'Public Sans',sans-serif;color:#1c1e15;\">Automatiser le rapprochement comptable<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:172px;background:#158158;border-radius:6px;padding:20px 30px;font:400 19px/1.5 'Public Sans',sans-serif;color:#c9cbbc;\">Compte 501 dédié · Reprise → remboursement CB client · Annulation → remboursement compte bancaire client · Cycle de vie limité aux statuts PAYÉ / ÉCHEC. Modèle COBO existant : <span style=\"color:#93cc3e;font-weight:600;\">Banque Client → Fintecture → ADEO+ → LMFR<\u002Fspan> (distinction WEB / Magasin gérée par Omnistore).<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:290px;bottom:60px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;\">\n    <div style=\"background:#ffffff;border:2px solid #93cc3e;border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font:700 18px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6a9c1f;\">Lot 1 — dans le scope · Q2-Q3 2026<\u002Fdiv>\n      <div style=\"font:600 21px 'Public Sans',sans-serif;color:#1c1e15;\">Saisie client (DSP2)<\u002Fdiv>\n      <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#6d7060;\">Prénom, nom, email, tél obligatoires. Client fid. : récupération des données. Client non fid. : saisie (contrainte DSP2).<\u002Fdiv>\n      <div style=\"margin-top:auto;font:600 18px 'Public Sans',sans-serif;color:#6a9c1f;\">→ Parcours UX à réaliser<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font:700 18px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6d7060;\">Lot 2 · Q4 2026<\u002Fdiv>\n      <div style=\"font:600 21px 'Public Sans',sans-serif;color:#1c1e15;\">Statuts paiement &amp; périmètre franchisés<\u002Fdiv>\n      <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#6d7060;\">Statuts intermédiaires « lien envoyé », « banque sélectionnée » affichés en caisse → chantier Omnistore × Fintecture. Franchisés exclus aujourd'hui (flux comptables distincts) ; à cadrer avec l'OTC.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font:700 18px 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6d7060;\">Lot 3 · S1 2027<\u002Fdiv>\n      <div style=\"font:600 21px 'Public Sans',sans-serif;color:#1c1e15;\">Remboursement<\u002Fdiv>\n      <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#6d7060;\">Remboursement par virement à étudier dans une réflexion globale, pour un remboursement sans effort pour le client.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;bottom:22px;font:400 16px 'Public Sans',sans-serif;color:#9a9d8d;\">❗ Valider le lotissement avec la Comptabilité.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Roadmap ajustée\" data-speaker-notes=\"Roadmap ajustée avec pilotes magasins\" style=\"background:#faf9f4;position:relative;font-family:'Public Sans',sans-serif;\">\n  <div style=\"position:absolute;left:100px;top:56px;font:600 18px/1 'Public Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6a9c1f;\">Avancement<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;top:96px;right:100px;font:800 46px/1.2 'Public Sans',sans-serif;color:#1c1e15;\">Roadmap ajustée<\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:190px;display:flex;\">\n    <div style=\"width:190px;\"><\u002Fdiv>\n    <div style=\"flex:1;display:grid;grid-template-columns:repeat(9,1fr);font:600 16px 'Public Sans',sans-serif;color:#6d7060;text-align:center;\">\n      <div>AVR<\u002Fdiv><div>MAI<\u002Fdiv><div>JUIN<\u002Fdiv><div>JUIL<\u002Fdiv><div>AOÛT<\u002Fdiv><div>SEPT<\u002Fdiv><div>OCT<\u002Fdiv><div>NOV<\u002Fdiv><div>DÉC<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:230px;height:1px;background:#e6e3d8;\"><\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:260px;display:flex;align-items:center;\">\n    <div style=\"width:190px;font:700 18px 'Public Sans',sans-serif;color:#1c1e15;\">ADEO<\u002Fdiv>\n    <div style=\"flex:1;position:relative;height:44px;\"><div style=\"position:absolute;left:0%;width:22%;top:8px;height:28px;background:#e6e3d8;border-radius:4px;color:#6d7060;font:600 14px/28px 'Public Sans',sans-serif;text-align:center;\">Paramétrages (pas de dév.)<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:314px;display:flex;align-items:center;\">\n    <div style=\"width:190px;font:700 18px 'Public Sans',sans-serif;color:#1c1e15;\">Omnistore/TCS<\u002Fdiv>\n    <div style=\"flex:1;position:relative;height:44px;\">\n      <div style=\"position:absolute;left:0%;width:11%;top:8px;height:28px;background:#c7d9a2;border-radius:4px;color:#1c1e15;font:600 14px/28px 'Public Sans',sans-serif;text-align:center;\">Cadrage<\u002Fdiv>\n      <div style=\"position:absolute;left:11%;width:33%;top:8px;height:28px;background:#6a9c1f;border-radius:4px;color:#fff;font:600 14px/28px 'Public Sans',sans-serif;text-align:center;\">Build<\u002Fdiv>\n      <div style=\"position:absolute;left:44%;top:-6px;font:22px/1 'Public Sans',sans-serif;\">🚩<\u002Fdiv>\n      <div style=\"position:absolute;left:46%;top:6px;font:600 16px 'Public Sans',sans-serif;color:#1c1e15;\">Déploiement magasin<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:368px;display:flex;align-items:center;\">\n    <div style=\"width:190px;font:700 18px 'Public Sans',sans-serif;color:#1c1e15;\">Pilote magasin<\u002Fdiv>\n    <div style=\"flex:1;position:relative;height:44px;\"><div style=\"position:absolute;left:55%;width:22%;top:8px;height:28px;background:#93cc3e;border-radius:4px;color:#1c1e15;font:600 14px/28px 'Public Sans',sans-serif;text-align:center;\">Sept. / Oct.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:422px;display:flex;align-items:center;\">\n    <div style=\"width:190px;font:700 18px 'Public Sans',sans-serif;color:#1c1e15;\">Paiement<\u002Fdiv>\n    <div style=\"flex:1;position:relative;height:44px;\"><div style=\"position:absolute;left:0%;width:88%;top:8px;height:28px;background:#f0efe7;border:1px dashed #c7c4b4;border-radius:4px;color:#6d7060;font:600 14px/26px 'Public Sans',sans-serif;text-align:center;\">Pilotage / contributeur — invoicing, fête des projets 🚀<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:500px;font:700 20px 'Public Sans',sans-serif;color:#1c1e15;\">Choix des pilotes magasins <span style=\"font-weight:400;color:#9a9d8d;\">— à valider<\u002Fspan><\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:550px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;\">\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:20px;text-align:center;font:600 20px 'Public Sans',sans-serif;color:#1c1e15;\">Cabriès<\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:20px;text-align:center;font:600 20px 'Public Sans',sans-serif;color:#1c1e15;\">Tourcoing <span style=\"font-weight:400;color:#c99a3a;font-size:16px;\">à valider<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:20px;text-align:center;font:600 20px 'Public Sans',sans-serif;color:#1c1e15;\">St Aunès<\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e6e3d8;border-radius:6px;padding:20px;text-align:center;font:600 20px 'Public Sans',sans-serif;color:#1c1e15;\">Melun <span style=\"font-weight:400;color:#9a9d8d;font-size:16px;\">pilote réseau connue<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:100px;right:100px;top:660px;background:#158158;border-radius:6px;padding:24px 30px;display:flex;justify-content:space-between;gap:24px;\">\n    <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#c9cbbc;\"><b style=\"color:#93cc3e;\">S1 2027 —<\u002Fb> Lot 2 (statuts intermédiaires + flux comptable) et Lot 3 (remboursement par virement).<\u002Fdiv>\n    <div style=\"font:400 19px/1.5 'Public Sans',sans-serif;color:#c9cbbc;\">Webinaire service client · classes virtuelles CS / RSC / CGM — Lot 1.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    perf1: false, perf2: false, perf3: false,\n    cli1: false, cli2: false, cli3: false,\n    col1: false, col2: false, col3: false,\n    p1: false, p2: false, p3: false, p4: false, p5: false,\n    s6row: 1, s6v1: 0, s6v2: 0, s6v3: 0, s6vssp: 0,\n    s7v1: 0, s7v2: 0, s7v3: 0, s7done: false,\n    s14v1: 90, s14v2: 0, s14v3: 0, s14v4: 0, s14v5: 0,\n    s15p1: false, s15p2: false, s15p3: false, s15p4: false\n  };\n\n  _slide14Setup(el) {\n    if (!el || this._slide14Bound) return;\n    this._slide14Bound = true;\n    const obs = new MutationObserver(() => {\n      if (el.hasAttribute('data-deck-active')) this._playProductivityAnim();\n      else {\n        if (this._prodCurrent) cancelAnimationFrame(this._prodCurrent.raf);\n        if (this._prodCurrent2) cancelAnimationFrame(this._prodCurrent2.raf);\n        if (this._prodPendingTimer) clearTimeout(this._prodPendingTimer);\n        this._prodPending = null;\n        this._prodCurrent = null;\n        this._prodCurrent2 = null;\n        this.setState({ s14v1: 90, s14v2: 0, s14v3: 0, s14v4: 0, s14v5: 0 });\n      }\n    });\n    obs.observe(el, { attributes: true, attributeFilter: ['data-deck-active'] });\n    if (el.hasAttribute('data-deck-active')) this._playProductivityAnim();\n  }\n\n  _scheduleProd(fn, delay) {\n    this._prodPending = fn;\n    this._prodPendingTimer = setTimeout(() => {\n      this._prodPending = null;\n      fn();\n    }, delay);\n  }\n\n  _skipProductivityAnim() {\n    if (this._prodCurrent || this._prodCurrent2) {\n      if (this._prodCurrent) { const cur = this._prodCurrent; this._prodCurrent = null; cancelAnimationFrame(cur.raf); cur.finish(); }\n      if (this._prodCurrent2) { const cur = this._prodCurrent2; this._prodCurrent2 = null; cancelAnimationFrame(cur.raf); cur.finish(); }\n    } else if (this._prodPending) {\n      clearTimeout(this._prodPendingTimer);\n      const p = this._prodPending;\n      this._prodPending = null;\n      p();\n    }\n  }\n\n  _animateProdVal(key, from, target, duration, cb, slot) {\n    slot = slot || 1;\n    const slotKey = slot === 2 ? '_prodCurrent2' : '_prodCurrent';\n    const start = performance.now();\n    const entry = { finish: null, raf: null };\n    const finish = () => {\n      this.setState({ [key]: target });\n      if (this[slotKey] === entry) this[slotKey] = null;\n      cb && cb();\n    };\n    entry.finish = finish;\n    this[slotKey] = entry;\n    const step = (now) => {\n      const t = Math.min(1, (now - start) / duration);\n      if (t < 1) {\n        this.setState({ [key]: from + (target - from) * t });\n        entry.raf = requestAnimationFrame(step);\n      } else {\n        finish();\n      }\n    };\n    entry.raf = requestAnimationFrame(step);\n  }\n\n  _playProductivityAnim() {\n    if (this._prodPendingTimer) clearTimeout(this._prodPendingTimer);\n    this._prodPending = null;\n    this._prodCurrent = null;\n    this._prodCurrent2 = null;\n    this.setState({ s14v1: 90, s14v2: 0, s14v3: 0, s14v4: 0, s14v5: 0 });\n    const PAUSE = 3000;\n    const DUR = 900;\n    this._scheduleProd(() => {\n      let doneCount = 0;\n      const afterBoth = () => {\n        doneCount++;\n        if (doneCount < 2) return;\n        this._scheduleProd(() => {\n          this._animateProdVal('s14v3', 0, 370000, DUR, () => {\n            this._scheduleProd(() => {\n              this._animateProdVal('s14v4', 0, 4625, DUR, () => {\n                this._scheduleProd(() => {\n                  this._animateProdVal('s14v5', 0, 34, DUR);\n                }, PAUSE);\n              });\n            }, PAUSE);\n          });\n        }, PAUSE);\n      };\n      this._animateProdVal('s14v1', 90, 120, DUR, afterBoth, 1);\n      this._animateProdVal('s14v2', 0, 60, DUR, afterBoth, 2);\n    }, 300);\n  }\n\n  _slide7Setup(el) {\n    if (!el || this._slide7Bound) return;\n    this._slide7Bound = true;\n    const obs = new MutationObserver(() => {\n      if (el.hasAttribute('data-deck-active')) this._playAdoptionAnim();\n      else {\n        if (this._adoptRaf) cancelAnimationFrame(this._adoptRaf);\n        if (this._adoptPendingTimer) clearTimeout(this._adoptPendingTimer);\n        this._adoptPending = null;\n        this._adoptCurrent = null;\n        this.setState({ s7v1: 0, s7v2: 0, s7v3: 0, s7done: false });\n      }\n    });\n    obs.observe(el, { attributes: true, attributeFilter: ['data-deck-active'] });\n    if (el.hasAttribute('data-deck-active')) this._playAdoptionAnim();\n  }\n\n  _skipAdoptionAnim() {\n    if (this._adoptCurrent) {\n      if (this._adoptRaf) cancelAnimationFrame(this._adoptRaf);\n      const cur = this._adoptCurrent;\n      this._adoptCurrent = null;\n      cur.finish();\n    } else if (this._adoptPending) {\n      clearTimeout(this._adoptPendingTimer);\n      const p = this._adoptPending;\n      this._adoptPending = null;\n      p();\n    }\n  }\n\n  _scheduleAdopt(fn, delay) {\n    this._adoptPending = fn;\n    this._adoptPendingTimer = setTimeout(() => {\n      this._adoptPending = null;\n      fn();\n    }, delay);\n  }\n\n  _adoptAnimateOne(key, target, duration, cb) {\n    const start = performance.now();\n    const finish = () => {\n      this.setState({ [key]: target });\n      this._adoptCurrent = null;\n      cb && cb();\n    };\n    this._adoptCurrent = { finish };\n    const step = (now) => {\n      const t = Math.min(1, (now - start) / duration);\n      if (t < 1) {\n        this.setState({ [key]: target * t });\n        this._adoptRaf = requestAnimationFrame(step);\n      } else {\n        finish();\n      }\n    };\n    this._adoptRaf = requestAnimationFrame(step);\n  }\n\n  _playAdoptionAnim() {\n    if (this._adoptRaf) cancelAnimationFrame(this._adoptRaf);\n    if (this._adoptPendingTimer) clearTimeout(this._adoptPendingTimer);\n    this._adoptPending = null;\n    this._adoptCurrent = null;\n    this.setState({ s7v1: 0, s7v2: 0, s7v3: 0, s7done: false });\n    const PAUSE = 3000;\n    const DUR = 900;\n    this._scheduleAdopt(() => {\n      this._adoptAnimateOne('s7v1', 23, DUR, () => {\n        this._scheduleAdopt(() => {\n          this._adoptAnimateOne('s7v2', 54, DUR, () => {\n            this._scheduleAdopt(() => {\n              this._adoptAnimateOne('s7v3', 80, DUR, () => {\n                this.setState({ s7done: true });\n              });\n            }, PAUSE);\n          });\n        }, PAUSE);\n      });\n    }, 300);\n  }\n\n  _slide6Setup(el) {\n    if (!el || this._slide6Bound) return;\n    this._slide6Bound = true;\n    const obs = new MutationObserver(() => {\n      if (el.hasAttribute('data-deck-active')) this._playCostAnim();\n      else this._resetCostAnim();\n    });\n    obs.observe(el, { attributes: true, attributeFilter: ['data-deck-active'] });\n    if (el.hasAttribute('data-deck-active')) this._playCostAnim();\n  }\n\n  _skipCostAnim() {\n    if (this._costCurrent) {\n      if (this._costRaf) cancelAnimationFrame(this._costRaf);\n      const cur = this._costCurrent;\n      this._costCurrent = null;\n      cur.finish();\n    } else if (this._costPending) {\n      clearTimeout(this._costPendingTimer);\n      const p = this._costPending;\n      this._costPending = null;\n      p();\n    }\n  }\n\n  _scheduleCost(fn, delay) {\n    this._costPending = fn;\n    this._costPendingTimer = setTimeout(() => {\n      this._costPending = null;\n      fn();\n    }, delay);\n  }\n\n  _resetCostAnim() {\n    if (this._costPendingTimer) clearTimeout(this._costPendingTimer);\n    this._costPending = null;\n    this._costRaf && cancelAnimationFrame(this._costRaf);\n    this._costCurrent = null;\n    this.setState({ s6row: 1, s6v1: 0, s6v2: 0, s6v3: 0, s6vssp: 0 });\n  }\n\n  _animateVal(key, target, duration, cb) {\n    const start = performance.now();\n    const finish = () => {\n      this.setState({ [key]: target });\n      this._costCurrent = null;\n      cb && cb();\n    };\n    this._costCurrent = { finish };\n    const step = (now) => {\n      const t = Math.min(1, (now - start) / duration);\n      if (t < 1) {\n        this.setState({ [key]: target * t });\n        this._costRaf = requestAnimationFrame(step);\n      } else {\n        finish();\n      }\n    };\n    this._costRaf = requestAnimationFrame(step);\n  }\n\n  _playCostAnim() {\n    this._resetCostAnim();\n    const PAUSE = 2200;\n    this._scheduleCost(() => {\n      this._animateVal('s6v1', 0.10, 900, () => {\n        this._scheduleCost(() => {\n          this.setState({ s6row: 2 });\n          this._animateVal('s6v2', 0.08, 900, () => {\n            this._scheduleCost(() => {\n              this.setState({ s6row: 3 });\n              this._animateVal('s6v3', 0.07, 900, () => {\n                this._scheduleCost(() => {\n                  this.setState({ s6row: 4 });\n                  this._scheduleCost(() => {\n                    this._animateVal('s6vssp', 0.55, 900);\n                  }, 700);\n                }, PAUSE);\n              });\n            }, PAUSE);\n          });\n        }, PAUSE);\n      });\n    }, 300);\n  }\n  toggle(key) {\n    this.setState(s => ({ [key]: !s[key] }));\n  }\n  renderVals() {\n    const keys = ['perf1','perf2','perf3','cli1','cli2','cli3
